<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ders Detayı | Mehmet Ali Yıldırım</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        tsBordo: { DEFAULT: '#800020', light: '#a31236', dark: '#540015' },
                        tsMavi: { DEFAULT: '#00a8e8', light: '#33bcef', dark: '#0077a8' }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="css/style.css">

    <!-- Firebase SDK (Compat Modu) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-[#0d0f12] dark:text-slate-100 min-h-screen flex flex-col font-sans">

    <!-- ORTAK MENÜ ALANI -->
    <div id="navbar-container"></div>

    <!-- ANA İÇERİK ALANI -->
    <main class="max-w-4xl mx-auto px-4 py-12 flex-grow w-full space-y-8" id="course-detail-container">
        <!-- Yükleniyor Mesajı -->
        <div class="py-20 text-center text-slate-500 dark:text-slate-400 text-sm">
            <span>⏳ Ders içeriği yükleniyor...</span>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="mt-auto border-t border-slate-200 dark:border-slate-800 py-6 text-center text-xs text-slate-500">
        <p>© 2026 Mehmet Ali Yıldırım. Tüm hakları saklıdır.</p>
    </footer>

    <!-- SCRIPT'LER -->
    <script src="js/main.js"></script>
    <script src="js/firebase.js"></script>
    <script>
        renderNavbar('dersler');

        // URL'den ders ID'sini al (örn: ders-detay.html?id=ABC123XYZ)
        const urlParams = new URLSearchParams(window.location.search);
        const courseId = urlParams.get('id');

        const container = document.getElementById('course-detail-container');

        if (!courseId) {
            container.innerHTML = `
                <div class="text-center py-20 text-red-500 font-semibold text-sm space-y-3">
                    <p>⚠️ Lütfen geçerli bir ders seçin veya ID bulunamadı!</p>
                    <a href="dersler.html" class="inline-block px-4 py-2 rounded-xl bg-slate-800 text-white text-xs">← Derslere Dön</a>
                </div>
            `;
        } else {
            // Firebase Firestore'dan seçilen özel derse ait veriyi çek
            db.collection("courses").doc(courseId).get().then((doc) => {
                if (doc.exists) {
                    const course = doc.data();
                    container.innerHTML = `
                        <!-- GERİ DÖN VE BAŞLIK -->
                        <div class="flex items-center justify-between border-b border-slate-200 dark:border-slate-800 pb-6">
                            <div class="flex items-center gap-4">
                                <div class="w-14 h-14 rounded-2xl bg-tsMavi/10 text-tsMavi flex items-center justify-center text-3xl shadow-inner">
                                    ${course.icon || '📚'}
                                </div>
                                <div>
                                    <h1 class="text-2xl md:text-3xl font-extrabold tracking-tight">${course.title}</h1>
                                    <p class="text-slate-500 text-xs mt-1 font-mono">${course.code || 'Genel Notlar'}</p>
                                </div>
                            </div>
                            <a href="dersler.html" class="px-4 py-2 rounded-xl bg-slate-100 dark:bg-slate-800 text-xs font-semibold hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors">
                                ← Derslere Dön
                            </a>
                        </div>

                        <!-- DERS AÇIKLAMASI -->
                        <div class="p-6 rounded-2xl bg-white dark:bg-slate-900/60 border border-slate-200 dark:border-slate-800 space-y-3 shadow-sm">
                            <h3 class="text-xs font-bold text-tsMavi uppercase tracking-wider">Ders / İçerik Hakkında</h3>
                            <p class="text-sm text-slate-600 dark:text-slate-300 leading-relaxed">${course.description}</p>
                        </div>

                        <!-- İÇERİK & VİDEO ALANI -->
                        <div class="p-12 text-center border border-dashed border-slate-300 dark:border-slate-800 rounded-3xl space-y-3 bg-slate-50/50 dark:bg-slate-900/20">
                            <div class="text-4xl">🎥</div>
                            <h3 class="font-bold text-base">Video İçerikleri & Notlar</h3>
                            <p class="text-xs text-slate-500 max-w-md mx-auto leading-relaxed">
                                Bu derse ait eğitim videoları, PDF notları ve ders belgeleri yakında buraya eklenecektir.
                            </p>
                        </div>
                    `;
                } else {
                    container.innerHTML = `
                        <div class="text-center py-20 text-red-500 font-semibold text-sm space-y-3">
                            <p>⚠️ Veritabanında bu kimliğe (ID) ait ders bulunamadı!</p>
                            <a href="dersler.html" class="inline-block px-4 py-2 rounded-xl bg-slate-800 text-white text-xs">← Derslere Dön</a>
                        </div>
                    `;
                }
            }).catch((error) => {
                container.innerHTML = `<div class="text-center py-20 text-red-500 text-xs">Veri çekilirken hata oluştu: ${error.message}</div>`;
            });
        }
    </script>
</body>
</html>
