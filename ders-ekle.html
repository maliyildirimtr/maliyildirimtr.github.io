<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mehmet Ali Yıldırım | Dersler & Notlar</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        tsBordo: { DEFAULT: '#800020', light: '#a31236', dark: '#540015' },
                        tsMavi: { DEFAULT: '#00a8e8', light: '#33bcef', dark: '#0077a8' }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="css/style.css">

    <!-- Firebase SDK (Compat Modu) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-[#0d0f12] dark:text-slate-100 min-h-screen flex flex-col font-sans">

    <!-- ORTAK MENÜ ALANI -->
    <div id="navbar-container"></div>

    <!-- ANA İÇERİK ALANI -->
    <main class="max-w-5xl mx-auto px-4 py-12 flex-grow w-full space-y-8">
        
        <!-- ÜST BAŞLIK VE EKLE / ÇIKIŞ BUTONLARI -->
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-slate-200 dark:border-slate-800 pb-6">
            <div>
                <h1 class="text-3xl font-extrabold tracking-tight">📚 Dersler ve Notlar</h1>
                <p class="text-slate-600 dark:text-slate-400 text-sm mt-1">İçeriğine gitmek istediğiniz ders penceresine tıklayın.</p>
            </div>
            
            <!-- AKSİYON BUTONLARI -->
            <div class="flex items-center gap-3" id="admin-actions">
                <a href="ders-ekle.html" title="Yeni Ders Ekle" class="px-4 py-2.5 rounded-xl bg-gradient-to-r from-tsBordo to-tsMavi text-white text-xs font-semibold shadow-md hover:opacity-95 transition-all flex items-center gap-1.5">
                    <span class="text-base leading-none">+</span> Ders Ekle
                </a>
            </div>
        </div>

        <!-- DERS KARTLARI LİSTESİ (FIREBASE'DEN CANLI GELECEK) -->
        <div id="courses-grid" class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Yükleniyor Mesajı -->
            <div class="col-span-full py-12 text-center text-slate-500 dark:text-slate-400 text-sm">
                <span>⏳ Dersler veritabanından yükleniyor...</span>
            </div>
        </div>

    </main>

    <!-- FOOTER -->
    <footer class="mt-auto border-t border-slate-200 dark:border-slate-800 py-6 text-center text-xs text-slate-500">
        <p>© 2026 Mehmet Ali Yıldırım. Tüm hakları saklıdır.</p>
    </footer>

    <!-- SCRIPT'LER -->
    <script src="js/main.js?v=1"></script>
    <script src="js/firebase.js?v=1"></script>
    <script>
        renderNavbar('dersler');

        const coursesGrid = document.getElementById('courses-grid');

        // FIREBASE'DEN DERSLERİ CANLI CANLI DİNLE & LİSTELE
        db.collection("courses").orderBy("createdAt", "desc").onSnapshot((snapshot) => {
            if (snapshot.empty) {
                coursesGrid.innerHTML = `
                    <div class="col-span-full py-12 text-center text-slate-500 dark:text-slate-400 text-sm border border-dashed border-slate-300 dark:border-slate-800 rounded-3xl">
                        <p>Henüz veritabanında kayıtlı ders bulunmuyor.</p>
                        <p class="text-xs text-slate-400 mt-1">Sağ üstteki <b>+ Ders Ekle</b> butonuna basarak ilk dersini ekleyebilirsin!</p>
                    </div>
                `;
                return;
            }

            let htmlContent = "";

            snapshot.forEach((doc) => {
                const course = doc.data();
                const courseId = doc.id;

                htmlContent += `
                    <div class="group relative p-6 rounded-3xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900/50 hover:border-tsMavi/50 dark:hover:border-tsMavi/50 transition-all shadow-sm hover:shadow-md flex flex-col justify-between">
                        <div>
                            <!-- İKON VE SİL BUTONU -->
                            <div class="flex items-center justify-between mb-4">
                                <div class="w-12 h-12 rounded-2xl bg-slate-100 dark:bg-slate-800 flex items-center justify-center text-xl shadow-inner">
                                    ${course.icon || '📚'}
                                </div>
                                <button onclick="deleteCourse('${courseId}', '${course.title}')" title="Dersi Sil" class="opacity-0 group-hover:opacity-100 px-2.5 py-1 rounded-lg bg-red-500/10 text-red-500 text-xs hover:bg-red-500 hover:text-white transition-all">
                                    🗑️ Sil
                                </button>
                            </div>

                            <!-- BAŞLIK VE AÇIKLAMA -->
                            <h2 class="text-xl font-bold text-slate-900 dark:text-white mb-2 group-hover:text-tsMavi transition-colors">
                                ${course.title}
                            </h2>
                            <p class="text-xs text-slate-600 dark:text-slate-400 leading-relaxed mb-6">
                                ${course.description}
                            </p>
                        </div>

                        <!-- ALT BİLGİ VE LİNK -->
                        <div class="flex items-center justify-between pt-4 border-t border-slate-100 dark:border-slate-800/80 text-xs">
                            <span class="text-slate-500 font-medium">${course.code || 'Genel Notlar'}</span>
                            <a href="${course.link}" class="font-semibold text-tsMavi hover:underline flex items-center gap-1">
                                İncele →
                            </a>
                        </div>
                    </div>
                `;
            });

            coursesGrid.innerHTML = htmlContent;
        }, (error) => {
            coursesGrid.innerHTML = `
                <div class="col-span-full py-8 text-center text-red-500 text-xs">
                    Veriler yüklenirken hata oluştu: ${error.message}
                </div>
            `;
        });

        // DERS SİLME FONKSİYONU
        function deleteCourse(id, title) {
            if (confirm(`"${title}" dersini silmek istediğinize emin misiniz?`)) {
                db.collection("courses").doc(id).delete().then(() => {
                    alert('Ders başarıyla silindi!');
                }).catch((error) => {
                    alert('Silinirken hata oluştu: ' + error.message);
                });
            }
        }
    </script>
</body>
</html>
