<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mehmet Ali Yıldırım | Yeni Ders / Not Ekle</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        tsBordo: { DEFAULT: '#800020', light: '#a31236', dark: '#540015' },
                        tsMavi: { DEFAULT: '#00a8e8', light: '#33bcef', dark: '#0077a8' }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="css/style.css">

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-[#0d0f12] dark:text-slate-100 min-h-screen flex flex-col font-sans">

    <div id="navbar-container"></div>

    <main class="max-w-4xl mx-auto px-4 py-12 flex-grow w-full space-y-8">
        
        <div class="flex items-center justify-between border-b border-slate-200 dark:border-slate-800 pb-6">
            <div>
                <h1 class="text-2xl font-extrabold tracking-tight">📚 Firebase'e Yeni Ders Ekle</h1>
                <p class="text-slate-600 dark:text-slate-400 text-xs mt-1">Buradan ekleyeceğiniz ders Google Firestore veritabanına işlenir.</p>
            </div>
            <a href="dersler.html" class="px-4 py-2 rounded-xl bg-slate-100 dark:bg-slate-800 text-xs font-semibold hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors flex items-center gap-1.5">
                <span>←</span> Derslere Dön
            </a>
        </div>

        <form id="add-course-form" class="p-8 rounded-3xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900/50 space-y-6 shadow-sm">
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 dark:text-slate-400 mb-1.5">Ders Adı *</label>
                    <input type="text" id="course-title" required placeholder="Örn: Yüksek Matematik" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-900 text-sm focus:outline-none focus:border-tsMavi">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 dark:text-slate-400 mb-1.5">İçerik Durumu / Kodu *</label>
                    <input type="text" id="course-code" required placeholder="Örn: 12 Video İçerik veya Hazırlanıyor" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-900 text-sm focus:outline-none focus:border-tsMavi">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-600 dark:text-slate-400 mb-1.5">Kart Görseli Yol/URL veya İkon *</label>
                <input type="text" id="course-icon" required placeholder="Örn: images/matematik.png veya ⚡" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-900 text-sm focus:outline-none focus:border-tsMavi">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-600 dark:text-slate-400 mb-1.5">Kısa Açıklama *</label>
                <textarea id="course-desc" rows="4" required placeholder="Dersin içeriği ve konuları hakkında kısa bir bilgi..." class="w-full px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-900 text-sm focus:outline-none focus:border-tsMavi resize-none"></textarea>
            </div>

            <div class="flex items-center justify-end gap-3 pt-4 border-t border-slate-100 dark:border-slate-800">
                <a href="dersler.html" class="px-5 py-2.5 rounded-xl text-xs font-semibold text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800">İptal</a>
                <button type="submit" id="submit-btn" class="px-6 py-2.5 rounded-xl bg-gradient-to-r from-tsBordo to-tsMavi text-white text-xs font-semibold shadow-md">
                    <span>➕</span> Veritabanına Kaydet
                </button>
            </div>
        </form>

    </main>

    <footer class="mt-auto border-t border-slate-200 dark:border-slate-800 py-6 text-center text-xs text-slate-500">
        <p>© 2026 Mehmet Ali Yıldırım. Tüm hakları saklıdır.</p>
    </footer>

    <script src="js/main.js"></script>
    <script src="js/firebase.js"></script>
    <script>
        renderNavbar('dersler');

        const form = document.getElementById('add-course-form');
        const submitBtn = document.getElementById('submit-btn');

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            submitBtn.disabled = true;
            submitBtn.innerHTML = "<span>⏳</span> Veritabanına Yazılıyor...";

            const newCourse = {
                title: document.getElementById('course-title').value,
                code: document.getElementById('course-code').value,
                icon: document.getElementById('course-icon').value,
                description: document.getElementById('course-desc').value,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            };

            db.collection("courses").add(newCourse)
            .then(() => {
                window.location.assign('dersler.html');
            })
            .catch((error) => {
                alert('Hata oluştu: ' + error.message);
                submitBtn.disabled = false;
                submitBtn.innerHTML = "<span>➕</span> Veritabanına Kaydet";
            });
        });
    </script>
</body>
</html>
