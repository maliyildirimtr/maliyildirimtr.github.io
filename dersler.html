<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dersler & Notlar | Mehmet Ali Yıldırım</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        tsBordo: { DEFAULT: '#800020', light: '#a31236', dark: '#540015' },
                        tsMavi: { DEFAULT: '#00a8e8', light: '#33bcef', dark: '#0077a8' }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="css/style.css">

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-[#0d0f12] dark:text-slate-100 min-h-screen flex flex-col font-sans">

    <!-- ORTAK NAVBAR CONTAINER -->
    <div id="navbar-container"></div>

    <!-- MAIN CONTENT -->
    <main class="max-w-6xl mx-auto px-4 py-12 flex-grow w-full space-y-8">
        
        <!-- ÜST BAŞLIK VE GİRİŞ PANELİ -->
        <div class="border-b border-slate-200 dark:border-slate-800 pb-6 flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div>
                <h1 class="text-3xl font-extrabold tracking-tight">Akademik Dersler & Eğitim Setleri</h1>
                <p class="text-slate-500 text-xs mt-1">İçeriğine gitmek istediğiniz ders penceresine tıklayın.</p>
            </div>

            <!-- KULLANICI / ADMİN KART VE GİRİŞ PANELİ (SAĞ TARAF) -->
            <div id="academy-user-panel" class="flex items-center gap-2">
                <div class="h-9 w-32 bg-slate-200 dark:bg-slate-800 animate-pulse rounded-xl"></div>
            </div>
        </div>

        <!-- DERS KARTLARI GRID -->
        <div id="courses-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <div class="col-span-full py-20 text-center text-slate-500 text-sm">⏳ Yükleniyor...</div>
        </div>
    </main>

    <!-- DERS EKLE / DÜZENLE MODAL (ADMIN) -->
    <div id="add-course-modal" class="fixed inset-0 z-50 hidden bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
        <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-6 max-w-md w-full space-y-4 shadow-2xl">
            <div class="flex items-center justify-between border-b border-slate-100 dark:border-slate-800 pb-3">
                <h3 class="text-base font-bold" id="course-modal-title">➕ Yeni Ders Ekle</h3>
                <button onclick="closeCourseModal()" class="text-slate-400 hover:text-white">✕</button>
            </div>
            
            <form id="add-course-form" class="space-y-4">
                <input type="hidden" id="edit-course-id">
                
                <div>
                    <label class="block text-xs font-semibold mb-1 text-slate-400">Ders Başlığı *</label>
                    <input type="text" id="course-title" required placeholder="Örn: Mantık Devreleri Tasarımı" class="w-full px-3.5 py-2 rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-800 text-xs focus:outline-none focus:border-tsMavi">
                </div>

                <div>
                    <label class="block text-xs font-semibold mb-1 text-slate-400">Ders Kodu / Kategori</label>
                    <input type="text" id="course-code" placeholder="Örn: EEE-201 veya Genel Notlar" class="w-full px-3.5 py-2 rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-800 text-xs focus:outline-none focus:border-tsMavi">
                </div>

                <div>
                    <label class="block text-xs font-semibold mb-1 text-slate-400">İkon / Görsel (Emoji veya Görsel Linki)</label>
                    <input type="text" id="course-icon" placeholder="Örn: ⚡ veya images/ders.png" class="w-full px-3.5 py-2 rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-800 text-xs focus:outline-none focus:border-tsMavi">
                </div>

                <div>
                    <label class="block text-xs font-semibold mb-1 text-slate-400">Kısa Açıklama</label>
                    <textarea id="course-description" rows="3" placeholder="Ders içeriği hakkında kısa bilgi..." class="w-full px-3.5 py-2 rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-800 text-xs focus:outline-none focus:border-tsMavi resize-none"></textarea>
                </div>

                <div class="flex justify-end gap-2 pt-2 border-t border-slate-100 dark:border-slate-800">
                    <button type="button" onclick="closeCourseModal()" class="px-4 py-2 rounded-xl text-xs font-semibold bg-slate-100 dark:bg-slate-800">İptal</button>
                    <button type="submit" class="px-4 py-2 rounded-xl text-xs font-semibold bg-gradient-to-r from-tsBordo to-tsMavi text-white shadow-md">Kaydet</button>
                </div>
            </form>
        </div>
    </div>

    <!-- HESAP / PROFİL DÜZENLEME MODALI -->
    <div id="user-profile-modal" class="fixed inset-0 z-50 hidden bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
        <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-6 max-w-sm w-full space-y-4 shadow-2xl">
            <div class="flex items-center justify-between border-b border-slate-100 dark:border-slate-800 pb-3">
                <h3 class="text-base font-bold">👤 Profil & Hesap Ayarları</h3>
                <button onclick="closeProfileModal()" class="text-slate-400 hover:text-white">✕</button>
            </div>

            <form id="profile-edit-form" onsubmit="updateUserProfile(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold mb-1 text-slate-400">E-Posta Adresiniz</label>
                    <input type="email" id="profile-email-disabled" disabled class="w-full px-3.5 py-2 rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-100 dark:bg-slate-800/50 text-slate-500 text-xs cursor-not-allowed">
                </div>

                <div>
                    <label class="block text-xs font-semibold mb-1 text-slate-400">Kullanıcı Adınız</label>
                    <input type="text" id="profile-display-name" required placeholder="Kullanıcı Adınız..." class="w-full px-3.5 py-2 rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-800 text-xs focus:outline-none focus:border-tsMavi">
                </div>

                <div class="flex justify-end gap-2 pt-2 border-t border-slate-100 dark:border-slate-800">
                    <button type="button" onclick="closeProfileModal()" class="px-4 py-2 rounded-xl text-xs font-semibold bg-slate-100 dark:bg-slate-800">İptal</button>
                    <button type="submit" id="profile-save-btn" class="px-4 py-2 rounded-xl text-xs font-semibold bg-gradient-to-r from-tsBordo to-tsMavi text-white shadow-md hover:opacity-90 transition-opacity">Değişiklikleri Kaydet</button>
                </div>
            </form>
        </div>
    </div>

    <!-- FOOTER -->
    <footer class="mt-auto border-t border-slate-200 dark:border-slate-800 py-6 text-center text-xs text-slate-500">
        <p>© 2026 Mehmet Ali Yıldırım. Tüm hakları saklıdır.</p>
    </footer>

    <!-- SCRIPTS -->
    <script src="js/firebase.js"></script>
    <script src="js/main.js"></script>
    <script src="js/courses-seed.js"></script>
    <script>
        // Sayfa Navbar Çizimi
        renderNavbar('dersler');

        // Akademi Panelini Sağ Taraf için Çiz
        function renderAcademyUserPanel() {
            const panel = document.getElementById('academy-user-panel');
            if (!panel) return;

            const user = typeof auth !== 'undefined' ? auth.currentUser : null;
            const adminState = typeof isAdmin === 'function' && isAdmin();

            if (user || adminState) {
                const displayName = adminState ? '👑 Admin' : ('👤 ' + (user.displayName || user.email.split('@')[0]));

                panel.innerHTML = `
                    <div class="flex items-center gap-2 bg-white dark:bg-slate-900 p-1.5 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm">
                        ${adminState ? `
                            <button onclick="openAddCourseModal()" class="px-3.5 py-1.5 rounded-xl bg-gradient-to-r from-tsBordo to-tsMavi text-white font-semibold text-xs shadow-md hover:opacity-90 transition-opacity flex items-center gap-1">
                                <span>＋</span> Ders Ekle
                            </button>
                        ` : ''}

                        <!-- KULLANICI ADI BUTONU -->
                        <button type="button" onclick="${adminState ? '' : 'openProfileModal()'}" title="${adminState ? '' : 'Kullanıcı Adını Değiştir'}" class="text-xs font-semibold px-3 py-1.5 rounded-xl transition-all ${adminState ? 'bg-amber-500/10 text-amber-500 border border-amber-500/20 cursor-default' : 'bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200 border border-slate-200 dark:border-slate-700 hover:border-tsMavi hover:text-tsMavi cursor-pointer'}">
                            ${displayName}
                        </button>

                        <button type="button" onclick="logoutUser()" title="Çıkış Yap" class="text-xs px-2.5 py-1.5 rounded-xl bg-red-500/10 hover:bg-red-500/20 text-red-500 border border-red-500/20 font-semibold transition-colors">
                            🚪 Çıkış
                        </button>
                    </div>
                `;
            } else {
                panel.innerHTML = `
                    <button type="button" onclick="openAuthModal()" class="px-4 py-2 rounded-2xl bg-gradient-to-r from-tsBordo to-tsMavi text-white font-semibold text-xs shadow-md hover:opacity-95 transition-all flex items-center gap-2">
                        🔑 Öğrenci Girişi / Kayıt
                    </button>
                `;
            }
        }

        // PROFİL MODALI FONKSİYONLARI
        function openProfileModal() {
            const user = typeof auth !== 'undefined' ? auth.currentUser : null;
            if (!user) return;

            const modal = document.getElementById('user-profile-modal');
            const emailInput = document.getElementById('profile-email-disabled');
            const nameInput = document.getElementById('profile-display-name');

            if (emailInput) emailInput.value = user.email || '';
            if (nameInput) nameInput.value = user.displayName || user.email.split('@')[0];

            if (modal) modal.classList.remove('hidden');
        }

        function closeProfileModal() {
            const modal = document.getElementById('user-profile-modal');
            if (modal) modal.classList.add('hidden');
        }

        function updateUserProfile(e) {
            e.preventDefault();
            const user = typeof auth !== 'undefined' ? auth.currentUser : null;
            if (!user) return;

            const newName = document.getElementById('profile-display-name').value.trim();
            const saveBtn = document.getElementById('profile-save-btn');

            if (!newName) {
                alert("Lütfen geçerli bir kullanıcı adı girin!");
                return;
            }

            if (saveBtn) saveBtn.innerText = "Kaydediliyor...";

            user.updateProfile({
                displayName: newName
            }).then(() => {
                alert("✅ Kullanıcı adınız başarıyla güncellendi!");
                closeProfileModal();
                location.reload();
            }).catch((err) => {
                alert("Güncelleme Hatası: " + err.message);
                if (saveBtn) saveBtn.innerText = "Değişiklikleri Kaydet";
            });
        }

        // Dersleri Yükleme Fonksiyonu (Tam Tıklanabilir & Sol Çizgili)
        function loadCourses() {
            const grid = document.getElementById('courses-grid');
            if (!grid) return;

            const renderCourseList = (coursesList) => {
                const adminState = typeof isAdmin === 'function' && isAdmin();
                let html = "";

                coursesList.forEach((course) => {
                    const courseId = course.id;
                    const iconContent = typeof renderIcon === 'function' ? renderIcon(course.icon) : (course.icon || '⚡');

                    html += `
                        <div onclick="window.location.href='ders-detay.html?id=${courseId}'" class="group relative rounded-3xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900/60 p-6 hover:border-tsMavi transition-all shadow-sm flex flex-col justify-between cursor-pointer overflow-hidden backdrop-blur-md">
                            
                            <!-- Sol Kenar Bordo-Mavi Geçiş Çizgisi -->
                            <div class="absolute top-0 left-0 w-1.5 h-full bg-gradient-to-b from-tsBordo to-tsMavi opacity-80 group-hover:opacity-100 transition-opacity"></div>

                            ${adminState ? `
                                <div class="absolute top-3 right-3 z-10 flex items-center gap-1 bg-black/60 backdrop-blur-md px-2 py-1 rounded-xl opacity-0 group-hover:opacity-100 transition-opacity" onclick="event.stopPropagation()">
                                    <button onclick="openEditCourseModal('${courseId}', '${(course.title||'').replace(/'/g, "\\'")}', '${course.code||''}', '${course.icon||''}', '${(course.description||'').replace(/'/g, "\\'")}')" class="text-xs text-yellow-400 hover:text-yellow-300 px-1">✏️</button>
                                    <button onclick="deleteCourse('${courseId}', '${(course.title||'').replace(/'/g, "\\'")}')" class="text-xs text-red-400 hover:text-red-300 px-1">🗑️</button>
                                </div>
                            ` : ''}

                            <div>
                                <div class="w-12 h-12 rounded-2xl bg-tsMavi/10 text-tsMavi flex items-center justify-center text-2xl font-bold mb-4 overflow-hidden">
                                    ${iconContent}
                                </div>
                                <h3 class="font-bold text-lg group-hover:text-tsMavi transition-colors">${course.title}</h3>
                                <p class="text-xs font-mono text-slate-400 mt-1">${course.code || 'Genel Notlar'}</p>
                                <p class="text-xs text-slate-500 dark:text-slate-400 mt-3 line-clamp-2 leading-relaxed">${course.description || ''}</p>
                            </div>

                            <div class="pt-6 mt-6 border-t border-slate-100 dark:border-slate-800/60 flex items-center justify-between">
                                <span class="text-xs text-tsMavi font-semibold flex items-center gap-1 group-hover:translate-x-1 transition-transform">
                                    İçeriği İncele (15 Konu & Video) →
                                </span>
                            </div>
                        </div>
                    `;
                });

                grid.innerHTML = html;
            };

            db.collection("courses").orderBy("createdAt", "desc").onSnapshot((snapshot) => {
                let courses = [];
                if (!snapshot.empty) {
                    snapshot.docs.forEach((doc) => {
                        courses.push({ id: doc.id, ...doc.data() });
                    });
                }
                
                // Fallback olarak varsayılan SystemVerilog kursunu ekle
                if (courses.length === 0 && typeof SYSTEMVERILOG_COURSE_DATA !== 'undefined') {
                    courses = [SYSTEMVERILOG_COURSE_DATA];
                }

                renderCourseList(courses);
            }, (err) => {
                console.warn("Firestore çekme hatası, varsayılan dersler yükleniyor:", err);
                if (typeof SYSTEMVERILOG_COURSE_DATA !== 'undefined') {
                    renderCourseList([SYSTEMVERILOG_COURSE_DATA]);
                } else {
                    grid.innerHTML = `<div class="col-span-full py-12 text-center text-red-500 text-xs">Veri yükleme hatası: ${err.message}</div>`;
                }
            });
        }

        // Modal Yönetimi
        function openAddCourseModal() {
            document.getElementById('edit-course-id').value = '';
            document.getElementById('add-course-form').reset();
            document.getElementById('course-modal-title').innerText = "➕ Yeni Ders Ekle";
            document.getElementById('add-course-modal').classList.remove('hidden');
        }

        function openEditCourseModal(id, title, code, icon, description) {
            document.getElementById('edit-course-id').value = id;
            document.getElementById('course-title').value = title;
            document.getElementById('course-code').value = code;
            document.getElementById('course-icon').value = icon;
            document.getElementById('course-description').value = description;
            document.getElementById('course-modal-title').innerText = "✏️ Dersi Düzenle";
            document.getElementById('add-course-modal').classList.remove('hidden');
        }

        function closeCourseModal() {
            document.getElementById('add-course-modal').classList.add('hidden');
            document.getElementById('add-course-form').reset();
            document.getElementById('edit-course-id').value = '';
        }

        // Form Submit
        document.getElementById('add-course-form').addEventListener('submit', function(e) {
            e.preventDefault();
            if (typeof isAdmin === 'function' && !isAdmin()) return;

            const editId = document.getElementById('edit-course-id').value;
            const title = document.getElementById('course-title').value.trim();
            const code = document.getElementById('course-code').value.trim();
            const icon = document.getElementById('course-icon').value.trim();
            const description = document.getElementById('course-description').value.trim();

            if (editId) {
                db.collection("courses").doc(editId).update({
                    title, code, icon, description
                }).then(() => closeCourseModal());
            } else {
                db.collection("courses").add({
                    title, code, icon, description,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                }).then(() => closeCourseModal());
            }
        });

        function deleteCourse(id, title) {
            if (typeof isAdmin === 'function' && !isAdmin()) return;
            if (confirm(`"${title}" dersini ve tüm alt konularını silmek istediğinize emin misiniz?`)) {
                db.collection("courses").doc(id).delete();
            }
        }

        // Oturum Durumu Değiştiğinde Paneli Dinle
        if (typeof auth !== 'undefined') {
            auth.onAuthStateChanged(() => {
                renderAcademyUserPanel();
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderAcademyUserPanel();
            loadCourses();
        });
    </script>
</body>
</html>
