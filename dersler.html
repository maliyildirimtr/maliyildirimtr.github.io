<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mehmet Ali Yıldırım | Dersler & Kurslar</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        tsBordo: { DEFAULT: '#800020', light: '#a31236', dark: '#540015' },
                        tsMavi: { DEFAULT: '#00a8e8', light: '#33bcef', dark: '#0077a8' }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="css/style.css">

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-[#0d0f12] dark:text-slate-100 min-h-screen flex flex-col font-sans">

    <div id="navbar-container"></div>

    <main class="max-w-6xl mx-auto px-4 py-12 flex-grow w-full space-y-8">
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-slate-200 dark:border-slate-800 pb-6">
            <div>
                <h2 class="text-3xl font-extrabold tracking-tight">Akademik Dersler & Eğitim Setleri</h2>
                <p class="text-slate-600 dark:text-slate-400 text-sm mt-1">İçeriğine gitmek istediğiniz ders penceresine tıklayın.</p>
            </div>
            
            <!-- SADECE ADMIN GÖREBİLİR -->
            <div id="admin-add-course-btn" class="hidden">
                <a href="ders-ekle.html" class="px-4 py-2.5 rounded-xl bg-gradient-to-r from-tsBordo to-tsMavi text-white text-xs font-semibold shadow-md flex items-center gap-1.5">
                    <span class="text-base leading-none">+</span> Yeni Ders Ekle
                </a>
            </div>
        </div>

        <div id="course-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <div class="col-span-full py-12 text-center text-slate-500 text-sm">⏳ Yükleniyor...</div>
        </div>
    </main>

    <footer class="mt-auto border-t border-slate-200 dark:border-slate-800 py-6 text-center text-xs text-slate-500">
        <p>© 2026 Mehmet Ali Yıldırım. Tüm hakları saklıdır.</p>
    </footer>

    <script src="js/main.js"></script>
    <script src="js/firebase.js"></script>
    <script>
        renderNavbar('dersler');

        // Yönetici kontrolü
        if (isAdmin()) {
            document.getElementById('admin-add-course-btn').classList.remove('hidden');
        }

        const courseGrid = document.getElementById('course-grid');

        db.collection("courses").orderBy("createdAt", "desc").onSnapshot((snapshot) => {
            if (snapshot.empty) {
                courseGrid.innerHTML = `<div class="col-span-full py-12 text-center text-slate-500 text-xs border border-dashed border-slate-300 dark:border-slate-800 rounded-3xl">Henüz kayıtlı ders bulunmuyor.</div>`;
                return;
            }

            let htmlContent = "";
            const loggedIn = isAdmin();

            snapshot.forEach((doc) => {
                const course = doc.data();
                const courseId = doc.id;

                htmlContent += `
                    <div class="group p-6 rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900/60 hover:border-tsMavi transition-all duration-300 flex flex-col justify-between relative overflow-hidden shadow-sm hover:shadow-md">
                        <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-tsBordo to-tsMavi"></div>
                        <div class="space-y-4">
                            <div class="flex items-center justify-between">
                                <div class="w-12 h-12 rounded-xl bg-tsMavi/10 text-tsMavi dark:bg-tsMavi/20 flex items-center justify-center text-2xl font-bold">
                                    ${course.icon || '📚'}
                                </div>
                                ${loggedIn ? `
                                    <button onclick="deleteCourse('${courseId}', '${course.title}')" title="Dersi Sil" class="opacity-0 group-hover:opacity-100 px-2.5 py-1 rounded-lg bg-red-500/10 text-red-500 text-xs hover:bg-red-500 hover:text-white transition-all">
                                        🗑️ Sil
                                    </button>
                                ` : ''}
                            </div>
                            <div>
                                <h3 class="text-xl font-bold group-hover:text-tsMavi transition-colors">${course.title}</h3>
                                <p class="text-slate-600 dark:text-slate-400 text-sm mt-2 leading-relaxed">${course.description}</p>
                            </div>
                        </div>
                        <div class="pt-6 border-t border-slate-100 dark:border-slate-800/60 mt-6 flex items-center justify-between text-xs text-slate-500 font-mono">
                            <span>${course.code || 'Genel Notlar'}</span>
                            <a href="ders-detay.html?id=${courseId}" class="group-hover:translate-x-1 transition-transform font-semibold text-tsMavi hover:underline">İncele →</a>
                        </div>
                    </div>
                `;
            });

            courseGrid.innerHTML = htmlContent;
        });

        function deleteCourse(id, title) {
            if (confirm(`"${title}" dersini silmek istediğinize emin misiniz?`)) {
                db.collection("courses").doc(id).delete();
            }
        }
    </script>
</body>
</html>
