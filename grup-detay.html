<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grup Çalışma Alanı | Mali Academy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        tsBordo: '#800020',
                        tsMavi: '#00a8e8',
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .ts-gradient-bg { background: linear-gradient(135deg, rgba(128,0,32,0.15) 0%, rgba(0,168,232,0.15) 100%); }
        .ts-gradient-btn { background: linear-gradient(135deg, #800020 0%, #00a8e8 100%); }
        .glass-card { background: rgba(15, 23, 42, 0.65); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-[#0d0f12] dark:text-slate-100 min-h-screen flex flex-col font-sans transition-colors duration-300">

    <div id="navbar-container"></div>

    <main class="max-w-7xl mx-auto px-4 py-10 flex-grow w-full space-y-8" id="workspace-container">
        
        <!-- ADMIN ERİŞİM KONTROL UYARISI -->
        <div id="admin-access-guard" class="hidden py-16 text-center space-y-4">
            <div class="w-20 h-20 mx-auto rounded-3xl bg-amber-500/10 text-amber-500 flex items-center justify-center text-4xl border border-amber-500/20">
                🔒
            </div>
            <h2 class="text-2xl font-extrabold text-slate-100">Özel Yönetici Modülü</h2>
            <p class="text-slate-400 text-sm max-w-md mx-auto">
                Bu proje çalışma alanı şu anda geliştirme aşamasındadır ve yalnızca **Admin (Yönetici)** erişimine açıktır.
            </p>
            <div class="flex justify-center items-center gap-3 pt-2">
                <button onclick="openLoginModal()" class="px-6 py-3 rounded-xl ts-gradient-btn text-white text-xs font-bold shadow-lg hover:opacity-90 transition-all flex items-center gap-2">
                    🔑 Yönetici Girişi Yap
                </button>
                <a href="index.html" class="px-5 py-3 rounded-xl bg-slate-800 text-slate-200 text-xs font-semibold hover:bg-slate-700 transition-colors">
                    ← Ana Sayfaya Dön
                </a>
            </div>
        </div>

        <div id="group-workspace-content" class="space-y-8">
            <div class="py-20 text-center text-slate-500 text-sm">⏳ Çalışma Alanı Yükleniyor...</div>
        </div>

    </main>

    <!-- MODAL: YENİ GÖREV EKLE -->
    <div id="add-task-modal" class="fixed inset-0 z-50 hidden bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-6 max-w-md w-full space-y-4 shadow-2xl">
            <div class="flex items-center justify-between border-b border-slate-100 dark:border-slate-800 pb-3">
                <h3 class="text-base font-bold">📋 Görev Ekle / Düzenle</h3>
                <button onclick="closeAddTaskModal()" class="text-slate-400 hover:text-white">✕</button>
            </div>

            <form id="add-task-form" onsubmit="handleSaveTask(event)" class="space-y-4">
                <input type="hidden" id="task-id-input">
                <div>
                    <label class="block text-xs font-semibold mb-1 text-slate-400">Görev Başlığı *</label>
                    <input type="text" id="task-title-input" required placeholder="Örn: SystemVerilog ALU Modülü Kodlaması" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-800 text-xs focus:outline-none focus:border-tsMavi">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold mb-1 text-slate-400">Öncelik *</label>
                        <select id="task-priority-input" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-800 text-xs focus:outline-none focus:border-tsMavi">
                            <option value="Yüksek">🔴 Yüksek</option>
                            <option value="Orta" selected>🟡 Orta</option>
                            <option value="Düşük">🟢 Düşük</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold mb-1 text-slate-400">Atanan Üye</label>
                        <input type="text" id="task-assignee-input" placeholder="Örn: Mehmet Ali" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-800 text-xs focus:outline-none focus:border-tsMavi">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold mb-1 text-slate-400">Görev Açıklaması</label>
                    <textarea id="task-desc-input" rows="3" placeholder="Görev detayları ve kabul kriterleri..." class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-800 text-xs focus:outline-none focus:border-tsMavi resize-none"></textarea>
                </div>

                <div class="flex justify-end gap-2 pt-2 border-t border-slate-100 dark:border-slate-800">
                    <button type="button" onclick="closeAddTaskModal()" class="px-4 py-2 rounded-xl text-xs font-semibold bg-slate-100 dark:bg-slate-800">İptal</button>
                    <button type="submit" class="px-5 py-2 rounded-xl text-xs font-bold bg-tsMavi text-white shadow-md">Görevi Kaydet</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MODAL: YENİ HARCAMA EKLE -->
    <div id="add-expense-modal" class="fixed inset-0 z-50 hidden bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-6 max-w-md w-full space-y-4 shadow-2xl">
            <div class="flex items-center justify-between border-b border-slate-100 dark:border-slate-800 pb-3">
                <h3 class="text-base font-bold">💳 Yeni Harcama Kaydı Ekle</h3>
                <button onclick="closeAddExpenseModal()" class="text-slate-400 hover:text-white">✕</button>
            </div>

            <form id="add-expense-form" onsubmit="handleSaveExpense(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold mb-1 text-slate-400">Harcama Kalemi *</label>
                    <input type="text" id="expense-title-input" required placeholder="Örn: FPGA DE10-Lite Geliştirme Kartı" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-800 text-xs focus:outline-none focus:border-tsMavi">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold mb-1 text-slate-400">Tutar (TL) *</label>
                        <input type="number" id="expense-amount-input" step="0.01" required placeholder="Örn: 2450.00" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-800 text-xs focus:outline-none focus:border-tsMavi">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold mb-1 text-slate-400">Harcayan Üye</label>
                        <input type="text" id="expense-payer-input" placeholder="Örn: Mehmet Ali" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-800 text-xs focus:outline-none focus:border-tsMavi">
                    </div>
                </div>

                <div class="flex justify-end gap-2 pt-2 border-t border-slate-100 dark:border-slate-800">
                    <button type="button" onclick="closeAddExpenseModal()" class="px-4 py-2 rounded-xl text-xs font-semibold bg-slate-100 dark:bg-slate-800">İptal</button>
                    <button type="submit" class="px-5 py-2 rounded-xl text-xs font-bold ts-gradient-btn text-white shadow-md">Harcamayı İşle</button>
                </div>
            </form>
        </div>
    </div>

    <!-- SCRIPTS -->
    <script src="js/firebase.js"></script>
    <script src="js/main.js"></script>
    <script src="js/grup-detay.js"></script>
</body>
</html>
