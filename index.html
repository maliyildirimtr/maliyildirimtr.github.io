<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yakında Burada!</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f5f5f7;
            color: #1d1d1f;
        }
        .card {
            text-align: center;
            padding: 40px;
            background: white;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }
        h1 { margin-bottom: 10px; }
        p { color: #86868b; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Sitemiz Yakında Yayında! 🚀</h1>
        <p>Şu an yapım aşamasındadır. Çok yakında buradayız.</p>
    </div>
</body>
</html>
