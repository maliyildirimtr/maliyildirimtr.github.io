<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Konu İçeriği | Mehmet Ali Yıldırım</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
    
    <!-- Tailwind CSS -->
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="js/tailwind-config.js"></script>
    <link rel="stylesheet" href="css/style.css">

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
</head>
<body data-page="konu-detay" class="bg-slate-50 text-slate-900 dark:bg-[#0d0f12] dark:text-slate-100 min-h-screen flex flex-col font-sans">

    <!-- ORTAK MENÜ BAR -->
    <div id="navbar-container"></div>

    <!-- ANA İÇERİK -->
    <main class="max-w-5xl mx-auto px-4 py-12 flex-grow w-full space-y-12" id="topic-container">
        <div class="py-20 text-center text-slate-500 text-sm">⏳ İçerik yükleniyor...</div>
    </main>

    <!-- ADMIN DÜZENLEME MODALI -->
    <div id="topic-edit-modal" class="fixed inset-0 z-50 hidden bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
        <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-6 max-w-3xl w-full space-y-6 shadow-2xl max-h-[90vh] overflow-y-auto">
            <div class="flex items-center justify-between border-b border-slate-100 dark:border-slate-800 pb-3">
                <h3 class="text-base font-bold">⚙️ Konu İçeriği ve Materyalleri Düzenle</h3>
                <button onclick="closeEditModal()" class="text-slate-400 hover:text-white">✕</button>
            </div>
            
            <form id="edit-topic-form" class="space-y-6">
                <div>
                    <label class="block text-xs font-semibold mb-1.5 text-slate-400">YouTube Video URL</label>
                    <input type="url" id="input-video-url" placeholder="https://www.youtube.com/watch?v=..." class="w-full px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-800 text-sm focus:outline-none focus:border-tsMavi">
                </div>

                <div class="space-y-3 border-t border-slate-100 dark:border-slate-800 pt-4">
                    <div class="flex items-center justify-between">
                        <label class="text-xs font-bold text-red-500 flex items-center gap-1">📄 PDF Ders Notları</label>
                        <button type="button" onclick="addPdfInput()" class="px-3 py-1 rounded-lg bg-red-500/10 text-red-500 hover:bg-red-500 hover:text-white text-xs font-semibold transition-all">
                            + Başka PDF Ekle
                        </button>
                    </div>
                    <div id="pdf-inputs-container" class="space-y-3"></div>
                </div>

                <div class="space-y-3 border-t border-slate-100 dark:border-slate-800 pt-4">
                    <div class="flex items-center justify-between">
                        <label class="text-xs font-bold text-tsMavi flex items-center gap-1">💻 Kod Blokları</label>
                        <button type="button" onclick="addCodeInput()" class="px-3 py-1 rounded-lg bg-tsMavi/10 text-tsMavi hover:bg-tsMavi hover:text-white text-xs font-semibold transition-all">
                            + Başka Kod Bloğu Ekle
                        </button>
                    </div>
                    <div id="code-inputs-container" class="space-y-4"></div>
                </div>

                <div class="flex justify-end gap-2 pt-4 border-t border-slate-100 dark:border-slate-800">
                    <button type="button" onclick="closeEditModal()" class="px-5 py-2.5 rounded-xl text-xs font-semibold bg-slate-100 dark:bg-slate-800">İptal</button>
                    <button type="submit" class="px-6 py-2.5 rounded-xl text-xs font-semibold bg-gradient-to-r from-tsBordo to-tsMavi text-white shadow-md">Tüm Değişiklikleri Kaydet</button>
                </div>
            </form>
        </div>
    </div>

    <!-- FOOTER -->
    <footer class="mt-auto border-t border-slate-200 dark:border-slate-800 py-6 text-center text-xs text-slate-500">
        <p>© 2026 Mehmet Ali Yıldırım. Tüm hakları saklıdır.</p>
    </footer>

    <!-- SCRIPTS -->
    <script src="js/firebase.js"></script>
    <script src="js/main.js"></script>
    <script src="js/konu-detay.js"></script>
</body>
</html>
