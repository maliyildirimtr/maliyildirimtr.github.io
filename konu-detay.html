<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Konu İçeriği | Mehmet Ali Yıldırım</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        tsBordo: { DEFAULT: '#800020', light: '#a31236', dark: '#540015' },
                        tsMavi: { DEFAULT: '#00a8e8', light: '#33bcef', dark: '#0077a8' }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="css/style.css">

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-[#0d0f12] dark:text-slate-100 min-h-screen flex flex-col font-sans">

    <!-- ORTAK MENÜ BAR -->
    <div id="navbar-container"></div>

    <!-- ANA İÇERİK -->
    <main class="max-w-5xl mx-auto px-4 py-12 flex-grow w-full space-y-8" id="topic-container">
        <div class="py-20 text-center text-slate-500 text-sm">⏳ İçerik yükleniyor...</div>
    </main>

    <!-- ADMIN DÜZENLEME MODALI -->
    <div id="topic-edit-modal" class="fixed inset-0 z-50 hidden bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
        <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-6 max-w-2xl w-full space-y-4 shadow-2xl max-h-[90vh] overflow-y-auto">
            <div class="flex items-center justify-between border-b border-slate-100 dark:border-slate-800 pb-3">
                <h3 class="text-base font-bold">⚙️ Konu İçeriğini ve Materyalleri Düzenle</h3>
                <button onclick="closeEditModal()" class="text-slate-400 hover:text-white">✕</button>
            </div>
            
            <form id="edit-topic-form" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold mb-1 text-slate-400">YouTube Video URL</label>
                    <input type="url" id="input-video-url" placeholder="https://www.youtube.com/watch?v=..." class="w-full px-4 py-2 rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-800 text-sm focus:outline-none focus:border-tsMavi">
                </div>

                <div>
                    <label class="block text-xs font-semibold mb-1 text-slate-400">PDF Ders Notu Linki / Yolu</label>
                    <input type="text" id="input-pdf-url" placeholder="Örn: pdf/ders12-half-adder.pdf veya Google Drive Linki" class="w-full px-4 py-2 rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-800 text-sm focus:outline-none focus:border-tsMavi">
                </div>

                <div class="space-y-2">
                    <label class="block text-xs font-semibold text-slate-400">Kod Bloğu Başlığı (Örn: SystemVerilog Half Adder Modülü)</label>
                    <input type="text" id="input-code-title" placeholder="Half_Adder.sv" class="w-full px-4 py-2 rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-800 text-sm focus:outline-none focus:border-tsMavi">
                    
                    <label class="block text-xs font-semibold text-slate-400">Kod İçeriği</label>
                    <textarea id="input-code-content" rows="8" placeholder="// Verilog / C++ kodlarınızı buraya yapıştırın..." class="w-full px-4 py-2 rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-800 text-xs font-mono focus:outline-none focus:border-tsMavi resize-none"></textarea>
                </div>

                <div class="flex justify-end gap-2 pt-3 border-t border-slate-100 dark:border-slate-800">
                    <button type="button" onclick="closeEditModal()" class="px-4 py-2 rounded-xl text-xs font-semibold bg-slate-100 dark:bg-slate-800">İptal</button>
                    <button type="submit" class="px-5 py-2 rounded-xl text-xs font-semibold bg-gradient-to-r from-tsBordo to-tsMavi text-white shadow-md">Değişiklikleri Kaydet</button>
                </div>
            </form>
        </div>
    </div>

    <!-- FOOTER -->
    <footer class="mt-auto border-t border-slate-200 dark:border-slate-800 py-6 text-center text-xs text-slate-500">
        <p>© 2026 Mehmet Ali Yıldırım. Tüm hakları saklıdır.</p>
    </footer>

    <!-- SCRIPTS -->
    <script src="js/main.js"></script>
    <script src="js/firebase.js"></script>
    <script>
        renderNavbar('dersler');

        const urlParams = new URLSearchParams(window.location.search);
        const courseId = urlParams.get('courseId');
        const topicId = urlParams.get('topicId');
        const container = document.getElementById('topic-container');

        function getYouTubeId(url) {
            if(!url) return null;
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        function copyCode(button) {
            const codeBlock = button.parentElement.nextElementSibling.querySelector('code');
            navigator.clipboard.writeText(codeBlock.innerText).then(() => {
                const originalText = button.innerText;
                button.innerText = "✓ Kopyalandı!";
                button.classList.add('text-emerald-400');
                setTimeout(() => {
                    button.innerText = originalText;
                    button.classList.remove('text-emerald-400');
                }, 2000);
            });
        }

        function openEditModal(currentVideo, currentPdf, currentCodeTitle, currentCodeContent) {
            document.getElementById('input-video-url').value = currentVideo || '';
            document.getElementById('input-pdf-url').value = currentPdf || '';
            document.getElementById('input-code-title').value = currentCodeTitle || '';
            document.getElementById('input-code-content').value = currentCodeContent || '';
            document.getElementById('topic-edit-modal').classList.remove('hidden');
        }

        function closeEditModal() {
            document.getElementById('topic-edit-modal').classList.add('hidden');
        }

        if (!courseId || !topicId) {
            container.innerHTML = `<div class="text-center py-20 text-red-500">Konu bulunamadı!</div>`;
        } else {
            db.collection("courses").doc(courseId).collection("topics").doc(topicId).onSnapshot((doc) => {
                if (!doc.exists) {
                    container.innerHTML = `<div class="text-center py-20 text-red-500">Konu bulunamadı!</div>`;
                    return;
                }

                const topic = doc.data();
                const ytId = getYouTubeId(topic.videoUrl);
                const loggedIn = isAdmin();

                container.innerHTML = `
                    <!-- ÜST BAŞLIK VE GERİ BUTONU -->
                    <div class="flex items-center justify-between border-b border-slate-200 dark:border-slate-800 pb-6">
                        <div>
                            <h1 class="text-3xl font-extrabold tracking-tight">${topic.title}</h1>
                        </div>
                        <div class="flex items-center gap-2">
                            ${loggedIn ? `
                                <button onclick="openEditModal('${topic.videoUrl || ''}', '${topic.pdfUrl || ''}', '${(topic.codeTitle || '').replace(/'/g, "\\'")}', \`${(topic.codeContent || '').replace(/`/g, "\\`")}\`)" class="px-4 py-2 rounded-xl bg-yellow-500/10 text-yellow-500 border border-yellow-500/20 text-xs font-semibold hover:bg-yellow-500 hover:text-black transition-all">
                                    ⚙️ Düzenle / Materyal Ekle
                                </button>
                            ` : ''}
                            <a href="ders-detay.html?id=${courseId}" class="px-4 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-xs font-semibold hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors">
                                ← Konulara Dön
                            </a>
                        </div>
                    </div>

                    <!-- 1. YOUTUBE VİDEO OYNATICI -->
                    ${ytId ? `
                        <div class="relative aspect-video w-full rounded-3xl overflow-hidden border border-slate-200 dark:border-slate-800 shadow-xl bg-black">
                            <iframe class="w-full h-full" src="https://www.youtube.com/embed/${ytId}" title="${topic.title}" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
                        </div>
                    ` : ''}

                    <!-- 2. PDF DERS NOTLARI SEKSİYONU -->
                    ${topic.pdfUrl ? `
                        <div class="p-6 rounded-3xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900/60 space-y-4 shadow-sm">
                            <div class="flex items-center justify-between">
                                <div class="flex items-center gap-3">
                                    <div class="w-10 h-10 rounded-xl bg-red-500/10 text-red-500 flex items-center justify-center font-bold text-lg">📄</div>
                                    <div>
                                        <h3 class="font-bold text-sm">Ders Notları & Doküman (PDF)</h3>
                                        <p class="text-xs text-slate-500 dark:text-slate-400">İncelemek veya indirmek için aşağıdaki bağlantıyı kullanabilirsiniz.</p>
                                    </div>
                                </div>
                                <a href="${topic.pdfUrl}" target="_blank" class="px-4 py-2 rounded-xl bg-red-500/10 text-red-500 hover:bg-red-500 hover:text-white transition-all text-xs font-semibold border border-red-500/20 flex items-center gap-1.5">
                                    📥 PDF'i Aç / İndir
                                </a>
                            </div>
                        </div>
                    ` : ''}

                    <!-- 3. KOD BLOĞU SEKSİYONU -->
                    ${topic.codeContent ? `
                        <div class="rounded-3xl border border-slate-800 bg-[#0a0c10] overflow-hidden shadow-xl">
                            <div class="px-5 py-3 bg-[#12151c] border-b border-slate-800 flex items-center justify-between">
                                <div class="flex items-center gap-2">
                                    <span class="w-3 h-3 rounded-full bg-red-500 inline-block"></span>
                                    <span class="w-3 h-3 rounded-full bg-yellow-500 inline-block"></span>
                                    <span class="w-3 h-3 rounded-full bg-green-500 inline-block"></span>
                                    <span class="ml-2 text-xs font-mono text-slate-400 font-semibold">${topic.codeTitle || 'Kaynak Kod'}</span>
                                </div>
                                <button onclick="copyCode(this)" class="px-3 py-1 rounded-lg bg-slate-800/80 hover:bg-slate-700 text-slate-300 text-xs font-mono transition-colors border border-slate-700/50">
                                    📋 Kopyala
                                </button>
                            </div>
                            <div class="p-5 overflow-x-auto">
                                <pre class="font-mono text-xs text-slate-200 leading-relaxed"><code>${topic.codeContent.replace(/</g, "&lt;").replace(/>/g, "&gt;")}</code></pre>
                            </div>
                        </div>
                    ` : ''}
                `;
            });
        }

        // DÜZENLEME FORMUNU KAYDETME
        document.getElementById('edit-topic-form').addEventListener('submit', function(e) {
            e.preventDefault();
            if(!isAdmin()) return;

            const videoUrl = document.getElementById('input-video-url').value;
            const pdfUrl = document.getElementById('input-pdf-url').value;
            const codeTitle = document.getElementById('input-code-title').value;
            const codeContent = document.getElementById('input-code-content').value;

            db.collection("courses").doc(courseId).collection("topics").doc(topicId).update({
                videoUrl: videoUrl,
                pdfUrl: pdfUrl,
                codeTitle: codeTitle,
                codeContent: codeContent
            }).then(() => {
                closeEditModal();
            }).catch((err) => {
                alert("Hata oluştu: " + err.message);
            });
        });
    </script>
</body>
</html>
